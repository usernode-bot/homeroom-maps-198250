<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Homeroom Maps app icon — source artwork for brand/icon.png.
       Style per the platform's icon conventions: 512x512, one Lucide glyph
       ("map", ISC licence) in white 2px round strokes on its 24-unit grid
       scaled x12 into the middle 288px, over a diagonal two-stop gradient
       in the palette's indigo pair (this app's brand colour) with a faint
       white gloss at the top left. Re-render brand/icon.png from this file
       after any change (see brand/ICON.md). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8577FF"/><stop offset="1" stop-color="#4432D1"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.25" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#gloss)"/>
  <g filter="url(#shadow)">
    <g transform="translate(112 112) scale(12)" fill="none" stroke="#fff"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Lucide map glyph -->
      <path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277A2 2 0 0 1 10 3.5l4.106 2.053Z"/>
      <path d="M15 5.764v15"/>
      <path d="M9 3.236v15"/>
    </g>
  </g>
</svg>
