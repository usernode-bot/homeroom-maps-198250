<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>

  <title>Homeroom Maps</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%236366f1'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">

  <!-- Tailwind, PRECOMPILED per app. npm run build compiles tailwind.config.js
       and styles/tailwind-input.css to public/tailwind.css on every image
       build, so the stylesheet always matches this commit's markup. Class
       names must stay whole literals in the source or the extractor misses
       them. Never special-case this path in server.js. -->
  <link rel="stylesheet" href="/tailwind.css">

  <!-- The platform's native-feel UI kit: safe-area helpers for the fixed bars,
       native pressed states, and unNative.toast for transient status. Opt-in,
       centrally hosted, loaded by RELATIVE path and never vendored. The app
       stays fully functional if these tags fail to load. -->
  <link rel="stylesheet" href="/usernode-native/v1/native.css">

  <!-- The platform bridge, centrally hosted, loaded by RELATIVE path. It is
       NOT conditional on calling a bridge API: it is how the app answers the
       shell, reports its ground colour, and publishes the resolved platform
       theme and safe-area insets. Never vendor it and never write a hostname
       in front of it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>

  <!-- Theme bootstrap. Runs right after the bridge so it can read
       usernode.theme before first paint. The platform's resolved theme wins;
       prefers-color-scheme is only the standalone fallback; and this app's own
       System/Light/Dark override (in js/theme.js) layers on top of both. -->
  <script>
    (function () {
      var STORAGE_KEY = 'hm-theme';
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function preference() {
        try {
          var v = localStorage.getItem(STORAGE_KEY);
          if (v === 'light' || v === 'dark' || v === 'system') return v;
        } catch (e) {}
        return 'system';
      }
      function apply() {
        var pref = preference();
        var theme = (pref === 'light' || pref === 'dark')
          ? pref
          : (window.usernode && window.usernode.theme)
            || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      apply();
      window.addEventListener('usernode:theme-changed', apply);
      media.addEventListener('change', apply);
      // Expose the resolver so js/theme.js reuses the identical logic.
      window.__hmApplyTheme = apply;
    })();
  </script>

  <script src="/usernode-native/v1/native.js"></script>

  <style>
    /* Painting the page background before Tailwind's stylesheet arrives keeps
       the platform's top bar on the app's tone (see the bridge note above). */
    html { background: #0b0d12; }
    html:not(.dark) { background: #f6f7f9; }
  </style>
</head>
<body class="min-h-screen bg-bg text-ink antialiased">
  <!-- The app shell renders here. js/app.js builds the top bar, the screen
       host and the bottom navigation, and swaps the screen on hash changes. -->
  <div id="app" class="flex min-h-screen flex-col"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
